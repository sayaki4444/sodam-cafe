<!DOCTYPE html>
<html lang="ko">

<head>
  <!-- 1. 기본 인코딩 및 뷰포트 -->
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>소담터 카페 알리미</title>

  <!-- 2. PWA 메타태그 및 매니페스트 -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#003876" />

  <!-- 모바일 전체화면 설정 (Android / iOS) -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="소담터 카페 알리미" />

  <!-- iOS & 모바일 홈 화면 아이콘 -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- 3. 웹 폰트: Pretendard & Gaegu -->
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet">

  <!-- 4. Firebase SDK 로드 -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- 5. 분리된 외부 스타일시트 -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-container">
    <!-- 1. 상단 일체형 헤더 -->
    <header class="header">
      <div class="header-left-title">
        <h1 class="header-title">소담터 카페 알리미 ☕</h1>
      </div>
      <div class="header-actions">
        <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTheme()" aria-label="테마 전환">
          <span id="themeIcon">🌙</span> <span id="themeText">다크</span>
        </button>
        <button class="admin-toggle-btn" onclick="openAdminModal()" title="카페 관리자 설정" aria-label="카페 관리자 설정">⚙️</button>
        <a href="https://t.me/+n5J-xg8BI4tkYmE1" target="_blank" rel="noopener noreferrer" class="telegram-btn"
          title="텔레그램 공지 채널" aria-label="텔레그램 공지 채널">✈️</a>
      </div>
    </header>

    <!-- 2. 시그니처 커피잔 카드 -->
    <section class="status-card" id="statusCard" onclick="refreshCafeStatus()">
      <div class="mug-container">
        <svg class="mug-svg" viewBox="0 0 160 170" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path id="steam1" class="steam-path" d="M60,32 C55,24 68,14 62,6" />
          <path id="steam2" class="steam-path steam-2" d="M85,30 C80,20 93,12 88,4" />
          <clipPath id="mugClip">
            <path d="M25,40 L135,40 L127,132 Q127,140 119,140 L41,140 Q33,140 33,132 Z" />
          </clipPath>
          <rect id="coffeeFill" x="20" y="60" width="120" height="85" fill="var(--coffee-liquid)"
            clip-path="url(#mugClip)" />
          <ellipse cx="80" cy="62" rx="46" ry="6" fill="rgba(255,255,255,0.2)" clip-path="url(#mugClip)" />
          <path d="M25,40 L135,40 L127,132 Q127,140 119,140 L41,140 Q33,140 33,132 Z" stroke="var(--cup-stroke)"
            stroke-width="5" stroke-linejoin="round" />
          <path d="M135,55 C165,55 165,105 135,105" stroke="var(--cup-stroke)" stroke-width="6"
            stroke-linecap="round" />
        </svg>
      </div>

      <div class="status-title">소담터</div>
      <div class="status-hours">
        <span>🕒 운영시간 10:00 - 15:30 (월~금)</span>
      </div>

      <div class="badge-pill badge-green" id="stockBadge">
        <span class="badge-dot"></span>
        <span id="stockBadgeText">주문 가능</span>
      </div>
      <div class="status-desc" id="statusDescText">따뜻하고 시원한 커피로 힐링하세요!</div>
    </section>

    <!-- 3. 편의 서비스 그리드 -->
    <div class="section-title">
      <span>편의 서비스</span>
      <span class="section-subtitle">원클릭 메뉴</span>
    </div>

    <div class="quick-grid">
      <button class="quick-item" onclick="openModal('workModal')" aria-label="근무 시간 계산기 열기">
        <span class="quick-badge bg-red">근무</span>
        <div class="quick-icon">⏰</div>
        <div class="quick-label">근무시간 계산</div>
      </button>
      <button class="quick-item" onclick="openModal('resModal')" aria-label="근처 맛집 목록 열기">
        <span class="quick-badge bg-green">PICK</span>
        <div class="quick-icon">🍽️</div>
        <div class="quick-label">근처 맛집</div>
      </button>
    </div>
  </div>

  <!-- 4. 모달 바텀시트 영역 -->
  <!-- 1) 근무 시간 계산기 바텀시트 -->
  <div class="modal-overlay" id="workModal" onclick="closeOnBackdrop(event, 'workModal')">
    <div class="bottom-sheet">
      <div class="sheet-handle-area" onclick="closeModal('workModal')">
        <div class="sheet-handle"></div>
      </div>
      <div class="sheet-header">
        <div class="sheet-title">⏰ 근무 시간 계산기</div>
        <button class="sheet-close-btn" onclick="closeModal('workModal')" aria-label="닫기">✕</button>
      </div>

      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <label class="form-label" for="prevHours" style="margin-bottom:0;">⏱️ 현재까지 누적 근무시간</label>
        </div>
        <div class="form-row">
          <div class="input-wrapper">
            <input type="number" id="prevHours" value="32" min="0" max="40" inputmode="numeric" placeholder="32"
              oninput="calculateLeaveTime()">
            <span class="input-unit">시간</span>
          </div>
          <div class="input-wrapper">
            <input type="number" id="prevMinutes" value="0" min="0" max="59" inputmode="numeric" placeholder="00"
              oninput="calculateLeaveTime()">
            <span class="input-unit">분</span>
          </div>
        </div>
        <div class="preset-chips">
          <button type="button" class="preset-btn" onclick="setPresetWork(32, 0)">32시간 (정량)</button>
          <button type="button" class="preset-btn" onclick="setPresetWork(33, 0)">33시간</button>
          <button type="button" class="preset-btn" onclick="setPresetWork(34, 0)">34시간</button>
          <button type="button" class="preset-btn" onclick="setPresetWork(35, 0)">35시간</button>
          <button type="button" class="preset-btn" onclick="setPresetWork(36, 0)">36시간</button>
          <button type="button" class="preset-btn" onclick="setPresetWork(37, 0)">37시간</button>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <label class="form-label" for="startTime" style="margin-bottom:0;">⏰ 기준시간 (오늘 출근 / 시작 시각)</label>
          <button type="button" onclick="setNowAsStartTime()"
            style="background:none; border:none; color:var(--accent-color, #0284c7); font-size:11.5px; font-weight:800; cursor:pointer;">🕒
            현재 시각</button>
        </div>
        <input type="time" class="time-input" id="startTime" value="09:00" min="07:00" max="22:00"
          onchange="calculateLeaveTime()">
      </div>

      <button class="calc-btn" onclick="calculateLeaveTime()"><span>오늘 퇴근 가능 시각 계산 🚀</span></button>

      <div class="calc-result-box" id="calcResultBox" style="display:block;">
        <div style="font-size:13.5px; font-weight:800; color:var(--text-main); margin-top:2px;">오늘 퇴근 가능 시각</div>
        <div
          style="font-size:34px; font-weight:900; color:var(--accent-color, #0284c7); margin:4px 0 6px; letter-spacing:-0.5px;"
          id="leaveTimeResult">18:00</div>
        <div style="font-size:12px; color:var(--text-sub); font-weight:600; margin-top:4px;" id="remainCountdownText">
          퇴근까지 약 2시간 30분 남음 ✨</div>
      </div>
    </div>
  </div>

  <!-- 2) 맛집 리스트 바텀시트 -->
  <div class="modal-overlay" id="resModal" onclick="closeOnBackdrop(event, 'resModal')">
    <div class="bottom-sheet">
      <div class="sheet-handle-area" onclick="closeModal('resModal')">
        <div class="sheet-handle"></div>
      </div>
      <div class="sheet-header">
        <div>
          <div class="sheet-title">🍽️ 주변 맛집 추천</div>
          <div style="font-size:11.5px; font-weight:700; color:var(--accent-color, #0284c7); margin-top:2px;">⭐ 네이버 평점
            3.5+ 엄선 (반경 3.5km 이내)</div>
        </div>
        <button class="sheet-close-btn" onclick="closeModal('resModal')" aria-label="닫기">✕</button>
      </div>

      <div style="margin-bottom: 12px; display:flex; flex-direction:column; gap:8px;">
        <div
          style="display:flex; justify-content:space-between; align-items:center; background:var(--card-sub); padding:9px 12px; border-radius:12px; border:1px solid var(--border-color);">
          <span style="font-size:12px; font-weight:700; color:var(--text-sub);" id="gpsStatusText">📍 기준: 부산 영도구 해양로
            385</span>
          <span
            style="font-size:11px; font-weight:800; color:var(--accent-color, #0284c7); background:var(--tray-main-bg); padding:2px 7px; border-radius:8px;">반경
            3.5km 고정</span>
        </div>
        <a href="https://m.map.naver.com/search2/search.naver?query=%EB%B6%80%EC%82%B0+%EC%98%81%EB%8F%84%EA%B5%AC+%ED%95%B4%EC%96%91%EB%A1%9C+385+%EB%A7%9B%EC%A7%91&sm=clk"
          target="_blank" rel="noopener noreferrer" style="text-decoration:none;" class="naver-search-btn">
          <span>🟢 네이버 지도에서 주변 맛집 검색 ↗</span>
        </a>
      </div>

      <div class="filter-pills">
        <button class="pill-btn active" onclick="filterCategory('전체', this)">🌟 전체 (3.5+)</button>
        <button class="pill-btn" onclick="filterCategory('한식/찌개', this)">🍚 한식/찌개</button>
        <button class="pill-btn" onclick="filterCategory('중식', this)">🥟 중식</button>
        <button class="pill-btn" onclick="filterCategory('일식/돈까스', this)">🍣 일식/돈까스</button>
        <button class="pill-btn" onclick="filterCategory('양식/피자', this)">🍝 양식/피자</button>
        <button class="pill-btn" onclick="filterCategory('분식/치킨', this)">🍢 분식/치킨</button>
        <button class="pill-btn" onclick="filterCategory('고기/구이', this)">🥩 고기/구이</button>
        <button class="pill-btn" onclick="filterCategory('회/해산물', this)">🐟 회/해산물</button>
        <button class="pill-btn" onclick="filterCategory('카페/디저트', this)">☕ 카페/디저트</button>
      </div>

      <div id="restaurantList"></div>
    </div>
  </div>

  <!-- 분리된 모듈형 자바스크립트 로드 -->
  <script src="js/cafe.js"></script>
  <script src="js/work.js"></script>
  <script src="js/restaurants.js"></script>

  <script>
    // PWA 서비스 워커 등록
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA Service Worker registered:', reg.scope))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }
  </script>
</body>

</html>
